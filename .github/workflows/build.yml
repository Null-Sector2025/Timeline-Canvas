name: Android Build
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install system Gradle
        run: sudo apt update && sudo apt install gradle -y

      # 临时隐藏项目配置，避免读取app模块触发Kotlin插件
      - name: Backup settings file
        run: |
          mv settings.gradle settings.gradle.bak
          gradle wrapper --gradle-version 8.7
          mv settings.gradle.bak settings.gradle

      - name: Add execute permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: Release-APK
          path: app/build/outputs/apk/release/*.apk
