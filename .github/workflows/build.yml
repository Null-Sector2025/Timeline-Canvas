name: Android Build
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install system Gradle
        run: sudo apt update && sudo apt install gradle -y

      # 仅生成wrapper文件，不解析子项目，规避Kotlin插件预解析报错
      - name: Generate gradlew without evaluating subprojects
        run: gradle wrapper --gradle-version 8.7 --settings-file=/dev/null

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Output-APK
          path: app/build/outputs/apk/release/*.apk
