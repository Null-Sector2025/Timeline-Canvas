name: Android Build
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Download official Gradle wrapper
        run: |
          wget https://services.gradle.org/distributions/gradle-8.7-all.zip
          unzip gradle-8.7-all.zip
          mkdir -p gradle/wrapper
          cp gradle-8.7/lib/gradle-wrapper.jar gradle/wrapper/
          wget https://raw.githubusercontent.com/gradle/gradle/master/gradlew
          chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TimelineCanvas-APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk
