name: Android Build
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Prepare Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          # 直接下载对应版本wrapper.jar
          wget https://services.gradle.org/distributions/gradle-8.7-all.zip
          unzip -q gradle-8.7-all.zip gradle-8.7/lib/gradle-wrapper.jar
          mv gradle-8.7/lib/gradle-wrapper.jar gradle/wrapper/
          # 下载官方gradlew脚本
          wget https://raw.githubusercontent.com/gradle/gradle/v8.7/gradlew
          chmod +x gradlew
          rm -rf gradle-8.7 gradle-8.7-all.zip

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TimelineCanvas-APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk
